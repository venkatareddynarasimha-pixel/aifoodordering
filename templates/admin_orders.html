<!DOCTYPE html>
<html>
<head>
<title>Orders — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter;
background:#0F1117;
color:white;
margin:0;
}

.container{
padding:40px;
}

table{
width:100%;
border-collapse:collapse;
background:#181C27;
}

th,td{
padding:12px;
border-bottom:1px solid #2A2F45;
}

th{
color:#7B82A0;
text-transform:uppercase;
font-size:.7rem;
}

.badge{
padding:4px 10px;
border-radius:20px;
font-size:.7rem;
}

.pending{background:#F59E0B}
.confirmed{background:#3B82F6}
.delivered{background:#10B981}

.back{
display:inline-block;
margin-bottom:20px;
color:#6C63FF;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<a href="{% url 'admin_dashboard' %}" class="back">← Back to Dashboard</a>

<h2>All Orders</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Customer</th>
<th>Restaurant</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
</tr>
</thead>

<tbody>

{% for o in orders %}

<tr>

<td>#{{ o.id }}</td>

<td>{{ o.user.username }}</td>

<td>{{ o.restaurant.name }}</td>

<td>₹{{ o.total_amount }}</td>

<td>

<span class="badge
{% if o.status == 'PENDING' %}pending
{% elif o.status == 'CONFIRMED' %}confirmed
{% else %}delivered{% endif %}">

{{ o.status }}

</span>

</td>

<td>{{ o.created_at|date:"d M Y H:i" }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
